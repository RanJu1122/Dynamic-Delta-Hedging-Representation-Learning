[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svi-localvol"
version = "0.1.0"
description = "Reusable SVI/local-vol engine with calibration and dynamic-alpha workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[project.scripts]
svi-calibration = "pricing_svi_localvol_calibration.cli:cli"
dynamic-alpha = "dynamic_alpha_hedging.cli:cli"

[tool.setuptools.packages.find]
include = ["svi_localvol*", "pricing_svi_localvol_calibration*", "dynamic_alpha_hedging*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
